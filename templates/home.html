<!DOCTYPE html>

<html>

<head>

    <title>Student Exam Performance Predictor</title>

</head>

<body>

    <div class="login">

        <h1>Student Exam Performance Indicator</h1>

        <form action="{{ url_for('predict_datapoint') }}"
              method="post">

            <h2>Student Exam Performance Prediction</h2>

            <div>

                <label>Gender</label>

                <select name="gender" required>

                    <option selected disabled value="">
                        Select Gender
                    </option>

                    <option value="male">Male</option>

                    <option value="female">Female</option>

                </select>

            </div>

            <br>

            <div>

                <label>Race or Ethnicity</label>

                <select name="race_ethnicity" required>

                    <option selected disabled value="">
                        Select Ethnicity
                    </option>

                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>

                </select>

            </div>

            <br>

            <div>

                <label>Parental Level of Education</label>

                <select name="parental_level_of_education"
                        required>

                    <option selected disabled value="">
                        Select Parent Education
                    </option>

                    <option value="associate's degree">
                        associate's degree
                    </option>

                    <option value="bachelor's degree">
                        bachelor's degree
                    </option>

                    <option value="high school">
                        high school
                    </option>

                    <option value="master's degree">
                        master's degree
                    </option>

                    <option value="some college">
                        some college
                    </option>

                    <option value="some high school">
                        some high school
                    </option>

                </select>

            </div>

            <br>

            <div>

                <label>Lunch Type</label>

                <select name="lunch" required>

                    <option selected disabled value="">
                        Select Lunch Type
                    </option>

                    <option value="free/reduced">
                        free/reduced
                    </option>

                    <option value="standard">
                        standard
                    </option>

                </select>

            </div>

            <br>

            <div>

                <label>Test Preparation Course</label>

                <select name="test_preparation_course"
                        required>

                    <option selected disabled value="">
                        Select Course
                    </option>

                    <option value="none">None</option>

                    <option value="completed">
                        Completed
                    </option>

                </select>

            </div>

            <br>

            <div>

                <label>Reading Score</label>

                <input type="number"
                       name="reading_score"
                       min="0"
                       max="100"
                       required>

            </div>

            <br>

            <div>

                <label>Writing Score</label>

                <input type="number"
                       name="writing_score"
                       min="0"
                       max="100"
                       required>

            </div>

            <br>

            <div>

                <input type="submit"
                       value="Predict Maths Score">

            </div>

        </form>

        <br>

        <h2>
            Predicted Maths Score :
            {{ results }}
        </h2>

    </div>

</body>

</html>
